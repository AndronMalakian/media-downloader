name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare bundled FFmpeg and ffprobe
        run: python prepare_ffmpeg.py

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Media-Downloader"
          --icon "icon.ico"
          --add-data "icon.ico;."
          --add-data "version.txt;."
          --add-binary ".build-tools/ffmpeg/bin/ffmpeg.exe;ffmpeg/bin"
          --add-binary ".build-tools/ffmpeg/bin/ffprobe.exe;ffmpeg/bin"
          --add-data ".build-tools/ffmpeg/licenses;ffmpeg/licenses"
          --add-data ".build-tools/ffmpeg/manifest.json;ffmpeg"
          --add-data "main.py;."
          --add-data "downloader.py;."
          --add-data "pot.py;."
          --add-data "utils.py;."
          --add-data "README.md;."
          --add-data "README.en.md;."
          --collect-all ttkbootstrap
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --collect-all yt_dlp_plugins
          --hidden-import=yt_dlp_plugins.extractor.getpot_bgutil_http
          --hidden-import=yt_dlp_plugins.extractor.getpot_bgutil_script
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media-Downloader-exe
          path: dist/Media-Downloader.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Media-Downloader.exe
          generate_release_notes: true
